name: RSS Pipeline Health Check

on:
  push:
    paths:
      - 'scripts/seed-fetch-jobs.js'
      - 'scripts/rss/**'
      - 'migrations/**'
  schedule:
    - cron: '41 */6 * * *'  # Every 6 hours (off-peak minute)
  # ADO-639: the Netlify scheduled function netlify/functions/health-check-trigger.mjs dispatches this
  # workflow on main once a day at 13:23 UTC. That run (or a manual one) does the two daily checks below;
  # push runs skip them, and scheduled runs only offer to do them after 14:00 UTC as a backup (the
  # "Daily run watchdog" step). Each daily check runs once per day whichever run starts it: it claims the
  # day in the database first (daily_check_claims, migration 139, ADO-645).
  workflow_dispatch:
    inputs:
      # Netlify sends no inputs, so its run is false and obeys the daily claim.
      force:
        description: 'Run the daily checks again even if they already ran today (posts the digest again)'
        type: boolean
        default: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Read only by the two daily checks below (ADO-645): the force input, "check again today"
      DAILY_CHECK_FORCE: ${{ inputs.force && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run preflight check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🚀 Running preflight check..."
          node scripts/preflight-check.js

      - name: Check job queue state
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "📊 Checking job queue state..."
          node scripts/diagnose-job-queue.js

      # ADO-586: alert when a Claude routine has gone silent (Judge, Stories; ADO-624 added SCOTUS,
      # EO, Pardons and the Election front agent). It reads PROD, so it
      # runs on main only: a push or a manual run on test skips it and never touches PROD.
      # The script exits 1 only when the check could not run at all (missing credentials, crash,
      # npm ci failed). continue-on-error keeps the health check green, and the next step reports
      # that failure to Discord: a dead monitor must never be silent.
      - name: Routine silence check (PROD, main only)
        id: routine_silence
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional repository variables; empty = the script defaults (Judge 12 hours, Stories 6,
          # SCOTUS/EO 30 weekday hours, Pardons/fronts 30).
          SILENCE_HOURS_JUDGE: ${{ vars.SILENCE_HOURS_JUDGE }}
          SILENCE_HOURS_STORIES: ${{ vars.SILENCE_HOURS_STORIES }}
          SILENCE_HOURS_SCOTUS: ${{ vars.SILENCE_HOURS_SCOTUS }}
          SILENCE_HOURS_EO: ${{ vars.SILENCE_HOURS_EO }}
          SILENCE_HOURS_PARDONS: ${{ vars.SILENCE_HOURS_PARDONS }}
          SILENCE_HOURS_FRONTS: ${{ vars.SILENCE_HOURS_FRONTS }}
        run: node scripts/monitoring/alert-routine-silence.js

      # ADO-639 review + ADO-645: backup for the Netlify daily start. Every scheduled run at or after
      # 14:00 UTC (GitHub has been starting this workflow around 20:00 UTC) offers to do the two daily
      # checks (DAILY_CHECK_FALLBACK=1), and the daily claim decides. If today's checks are done or in
      # progress, they skip. If no run did them, or the run that tried failed or died (claim failed, or
      # stuck at running for 30 minutes), this run does them. A run's conclusion cannot tell those apart:
      # the daily steps are continue-on-error, so a run whose check failed still ends in success.
      # Needs migration 139 on PROD (see its APPLY note).
      - name: Daily run watchdog (PROD, main, scheduled runs only)
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'schedule'
        run: |
          hour=$(date -u +%H)
          if [ "$hour" -lt 14 ]; then
            echo "Before 14:00 UTC: the Netlify daily start (13:23 UTC) may still come. Nothing to do."
            exit 0
          fi
          echo "DAILY_CHECK_FALLBACK=1" >> "$GITHUB_ENV"
          echo "After 14:00 UTC: this run does the daily checks unless another run already did them today (the daily claim decides)."

      # ADO-597: daily ingest health (PROD, main only). Alerts when no article stored its text in 24h,
      # when articles land with empty excerpts, or when an active feed has been silent for 7 days.
      # The script itself only checks on a workflow_dispatch run (the Netlify daily start at 13:23 UTC, or a
      # manual run) or on the watchdog's offer, and only the run that claims the day checks: once a day. Same continue-on-error + follow-up
      # Discord pattern as the routine silence check.
      # ADO-645: both daily steps claim the day first (scripts/lib/daily-check-claim.js); a claim stuck
      # at "running" is taken over after 30 minutes, so each step must time out well before that.
      - name: Ingest health check (PROD, main only)
        id: ingest_health
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 10
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FEED_SILENT_DAYS: ${{ vars.FEED_SILENT_DAYS }}
        run: node scripts/monitoring/alert-ingest-health.js

      # ADO-602: the Stories agent's own needs_manual_review flags (stories_enrichment_log), PROD, main only.
      # Daily digest of the stories created yesterday 06:00 UTC to today 06:00 UTC, checked on the same
      # once-a-day run as the ingest health check (same gate, its own claim). The script posts its own "could not run" message; a failed
      # step (crash, npm ci failed, or an alert Discord did not accept) is reported by the follow-up step.
      - name: Stories flagged enrichments (PROD, main only)
        id: stories_review
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/monitoring/alert-needs-review.js --domain stories
        timeout-minutes: 2

      # ADO-645: a daily check that ran on the watchdog's offer (above) and got the day's claim did work
      # the Netlify run should have done (it never started, or its check did not finish), and says so in
      # its step output. Normally one ping per day: a later run finds the claim taken and stays quiet (a second backup
      # run pings again only if it takes over a claim the first backup run failed).
      - name: Discord alert (daily checks ran from the backup run)
        if: always() && github.ref == 'refs/heads/main' && (steps.ingest_health.outputs.fallback_ran == 'true' || steps.stories_review.outputs.fallback_ran == 'true')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "::warning::No Netlify-started run had finished the daily checks: this scheduled run did them instead"
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret not set - the backup run was not reported"
            exit 0
          fi
          payload=$(jq -n \
            --arg link "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{embeds: [{
               title: "Daily health check ran from the backup run",
               description: "GitHub'"'"'s scheduled backup run did the ingest health check and Stories flag digest today: the Netlify start (due 13:23 UTC) never ran, or its check did not finish. Check the health-check-trigger function in Netlify and the log of today'"'"'s workflow_dispatch run, if there is one: docs/guides/rss-prod-external-trigger.md.",
               color: 16098851,
               fields: [{name: "Run", value: "[View Logs](\($link))", inline: true}],
               timestamp: $now
             }]}')
          if ! curl -fsS -o /dev/null -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"; then
            echo "::error::Discord webhook failed - the backup run was not reported"
          fi

      - name: Discord alert (ingest health check could not run)
        if: always() && github.ref == 'refs/heads/main' && steps.ingest_health.outcome == 'failure'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "::error::Ingest health check could not run - RSS ingest is NOT being monitored"
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret not set - this failure could not be sent to Discord"
            exit 1
          fi
          if ! curl -f -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"Ingest health check could not run\",\"description\":\"RSS ingest (stored text, empty excerpts, silent feeds) is not being monitored until this is fixed.\",\"color\":15158332,\"fields\":[{\"name\":\"Run\",\"value\":\"[View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\",\"inline\":true}],\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}" \
            "$DISCORD_WEBHOOK_URL"; then
            echo "::error::Discord webhook failed - this failure could not be sent to Discord"
            exit 1
          fi

      - name: Discord alert (Stories flag digest could not run)
        if: always() && github.ref == 'refs/heads/main' && steps.stories_review.outcome == 'failure'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "::error::Stories flag digest could not run - Stories agent review flags are NOT being reported"
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret not set - this failure could not be sent to Discord"
            exit 1
          fi
          if ! curl -f -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"Stories flag digest could not run\",\"description\":\"Stories the agent flagged for review (needs_manual_review) are not being reported until this is fixed.\",\"color\":15158332,\"fields\":[{\"name\":\"Run\",\"value\":\"[View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\",\"inline\":true}],\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}" \
            "$DISCORD_WEBHOOK_URL"; then
            echo "::error::Discord webhook failed - this failure could not be sent to Discord"
            exit 1
          fi

      # No continue-on-error here on purpose: if Discord cannot be reached either, this step exits 1
      # and the run goes red, so GitHub's failed-run email is the last resort.
      - name: Discord alert (routine silence check could not run)
        if: always() && github.ref == 'refs/heads/main' && steps.routine_silence.outcome == 'failure'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "::error::Routine silence check could not run - the Judge and Stories routines are NOT being monitored"
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret not set - this failure could not be sent to Discord"
            exit 1
          fi
          if ! curl -f -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"Routine silence check could not run\",\"description\":\"The Judge and Stories routines are not being monitored until this is fixed (missing credentials, a crash, or npm ci failed).\",\"color\":15158332,\"fields\":[{\"name\":\"Run\",\"value\":\"[View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\",\"inline\":true}],\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}" \
            "$DISCORD_WEBHOOK_URL"; then
            echo "::error::Discord webhook failed - this failure could not be sent to Discord"
            exit 1
          fi

# .github/workflows/executive-orders-tracker.yml
name: Track Executive Orders
on:
  schedule:
    - cron: '0 16 * * *'  # 11:00 AM EST daily (2 hours after main tracker)
  workflow_dispatch:      # Manual trigger
    inputs:
      lookback_days:
        description: 'Days to look back for EOs (default 3; raise for backfills)'
        required: false
        default: '3'
      backfill_signing_dates:
        description: 'ADO-589 one-time: set to true to rewrite executive_orders.date from the Federal Register signing_date'
        required: false
        default: 'false'

# Prevents overlapping scheduled + manual runs from double-enriching
concurrency:
  group: eo-tracker
  cancel-in-progress: false

jobs:
  track-orders:
    # Skip scheduled runs on test branch (only run on main)
    # Manual triggers (workflow_dispatch) work on any branch
    # TTRC-362: Kill-switch for scheduled runs (workflow_dispatch still works)
    if: github.event_name != 'schedule' || (github.ref == 'refs/heads/main' && vars.ENABLE_PROD_SCHEDULES == 'true')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Detect environment
      id: env_detect
      run: |
        echo "Current ref: ${{ github.ref }}"
        echo "Current branch: ${GITHUB_REF#refs/heads/}"

        # Check if we're on test branch or if test file exists
        if [[ "${{ github.ref }}" == "refs/heads/test" ]] || [[ -f "TEST_BRANCH_MARKER.md" ]]; then
          echo "environment=test" >> $GITHUB_OUTPUT
          echo "🧪 Using TEST environment"
        else
          echo "environment=production" >> $GITHUB_OUTPUT
          echo "🚀 Using PRODUCTION environment"
        fi

    - name: Export env (prod|test)
      run: |
        if [ "${{ steps.env_detect.outputs.environment }}" = "production" ]; then
          echo "ENVIRONMENT=prod" >> $GITHUB_ENV
          echo "TARGET_ENV=prod" >> $GITHUB_ENV
        else
          echo "ENVIRONMENT=test" >> $GITHUB_ENV
          echo "TARGET_ENV=test" >> $GITHUB_ENV
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Phase 1 - Track Executive Orders (Supabase)
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        SUPABASE_URL: ${{ steps.env_detect.outputs.environment == 'test' && secrets.SUPABASE_TEST_URL || secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ steps.env_detect.outputs.environment == 'test' && secrets.SUPABASE_TEST_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ steps.env_detect.outputs.environment == 'test' && secrets.SUPABASE_TEST_SERVICE_KEY || secrets.SUPABASE_SERVICE_KEY }}
        EO_LOOKBACK_DAYS: ${{ inputs.lookback_days || '3' }}
      run: node scripts/executive-orders-tracker-supabase.js

    # ADO-589: one-time data fix, runs ONLY when dispatched with backfill_signing_dates=true.
    # Rewrites executive_orders.date (the site's "Signed" date) from the Federal Register
    # signing_date; idempotent, ~1 free API call per row. Runs before the tracker refresh
    # so the timeline picks up the corrected dates in the same run.
    - name: Backfill EO signing dates (ADO-589, on demand)
      if: github.event_name == 'workflow_dispatch' && inputs.backfill_signing_dates == 'true'
      env:
        SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
        SUPABASE_TEST_SERVICE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      run: |
        if [ "$TARGET_ENV" = "prod" ]; then
          node scripts/maintenance/backfill-eo-signing-dates.js --env prod --confirm-prod
        else
          node scripts/maintenance/backfill-eo-signing-dates.js --env test
        fi
      timeout-minutes: 10


    # ADO-581: sweep stories enriched since the last cycle into fronts before the refresh. Never fails.
    - name: Assign stories to fronts
      if: always()
      env:
        SUPABASE_URL: ${{ steps.env_detect.outputs.environment == 'test' && secrets.SUPABASE_TEST_URL || secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ steps.env_detect.outputs.environment == 'test' && secrets.SUPABASE_TEST_SERVICE_KEY || secrets.SUPABASE_SERVICE_KEY }}
      run: node scripts/maintenance/assign-fronts.js
      timeout-minutes: 2

    # ADO-570: new EOs count toward the homepage tally only after this refresh.
    - name: Refresh Tracker main line + tally
      if: always()
      env:
        SUPABASE_URL: ${{ steps.env_detect.outputs.environment == 'test' && secrets.SUPABASE_TEST_URL || secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ steps.env_detect.outputs.environment == 'test' && secrets.SUPABASE_TEST_SERVICE_KEY || secrets.SUPABASE_SERVICE_KEY }}
      run: node scripts/maintenance/refresh-tracker.js
      timeout-minutes: 2

    - name: Commit any changes (minimal, since data is in Supabase)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action - Executive Orders"
        # Only commit if there are actual file changes (unlikely with Supabase)
        git add -A
        git diff --staged --quiet || git commit -m "Executive Orders run - $(date +%Y-%m-%d)"
        git push || echo "No changes to push"

name: Track Pardons

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch: {}

concurrency:
  group: pardons-pipeline-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  track-pardons:
    if: >-
      github.event_name != 'schedule' ||
      (github.ref == 'refs/heads/main' && vars.ENABLE_PROD_SCHEDULES == 'true')

    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

      # scripts expect SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY
      SUPABASE_URL: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_URL || secrets.SUPABASE_TEST_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_TEST_SERVICE_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}   # ADO-577: new-work + flagged-enrichment alerts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Create log directory
        run: mkdir -p logs

      # Raw-only scrape (ADO-553): the Claude pardons agent owns research + enrichment
      # (daily cloud cron, ADO-516). Legacy Perplexity/GPT phases removed — same
      # pattern as the EO tracker (ADO-540).
      - name: "Ingest DOJ pardons (raw only)"
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ingest/doj-pardons-scraper.js 2>&1 | tee logs/01-ingest.log

      # ADO-570: new pardons count toward the homepage tally only after this refresh.
      # Uses the job-level SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY env (prod|test by branch).
      - name: Refresh Tracker main line + tally
        if: always()
        run: node scripts/maintenance/refresh-tracker.js
        timeout-minutes: 2

      # ADO-577: pardons the agent flagged (needs_review) ping Discord. Never fails the job.
      - name: Alert flagged enrichments (Discord)
        if: always()
        continue-on-error: true
        run: node scripts/monitoring/alert-needs-review.js --domain pardons
        timeout-minutes: 2

      - name: Upload logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: pardons-logs-${{ github.run_id }}
          path: logs
          retention-days: 7

      - name: Discord alert on failure
        if: failure() || cancelled()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "No DISCORD_WEBHOOK_URL; skipping"
            exit 0
          fi

          PAYLOAD="$(jq -n \
            --arg title "Pipeline Failed: ${{ github.workflow }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg trigger "${{ github.event_name }}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              embeds: [{
                title: $title,
                color: 15158332,
                fields: [
                  {name:"Branch", value:$branch, inline:true},
                  {name:"Trigger", value:$trigger, inline:true},
                  {name:"Run", value:("[View Logs](" + $url + ")"), inline:true}
                ],
                timestamp: (now | todateiso8601)
              }]
            }')"

          curl -fsS -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL" \
            || echo "Discord webhook failed (non-blocking)"

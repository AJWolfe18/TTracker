[build]
  command = "npm run build"
  publish = "dist"

# Explicit so a UI build setting can't silently drop the scheduled RSS trigger (ADO-637)
[functions]
  directory = "netlify/functions"

[[edge_functions]]
  function = "og-tags"
  path = "/detail/*"

[[edge_functions]]
  function = "og-tags"
  path = "/eos/*"

[[edge_functions]]
  function = "og-tags"
  path = "/scotus/*"

[[edge_functions]]
  function = "og-tags"
  path = "/pardons/*"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[edge_functions]]
  function = "og-image"
  path = "/api/og-image/*"
